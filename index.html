
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Challenge!</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f7ff;
    text-align: center;
    padding: 30px 15px;
    margin: 0;
  }

  .container {
    max-width: 550px;
    margin: 20px auto;
    background: white;
    padding: 30px 20px;
    border-radius: 18px;
    box-shadow: 0 5px 25px #0001;
  }

  h1 {
    color: #2878d0;
  }

  button {
    background: #2878d0;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 17px;
    cursor: pointer;
    margin: 10px;
  }

  button:hover {
    background: #165ba8;
  }

  #photo {
    width: 100%;
    max-width: 450px;
    border-radius: 12px;
    margin: 20px auto;
    display: none;
  }

  #status {
    margin: 20px;
    color: #2878d0;
  }

  .congrats {
    color: #159447;
    font-size: 28px;
  }
</style>
</head>

<body>

<div class="container">

  <h1>📸 Photo Challenge!</h1>

  <p>Ready to take your photo?</p>

  <button onclick="openCamera()">
    Open My Camera 📷
  </button>

  <p id="status">Waiting for your photo...</p>

  <div id="result" style="display:none">

    <h2 class="congrats">🎉 CONGRATULATIONS!</h2>

    <p>You did it! Here's your photo!</p>

    <img id="photo" alt="Your captured photo">

    <br>

    <button onclick="openCamera()">
      Take Another Photo
    </button>

  </div>

</div>

<script>

let cameraWindow = null;

function openCamera() {

  cameraWindow = window.open(
    "camera.html",
    "PhotoCamera",
    "width=650,height=750"
  );

  if (!cameraWindow) {

    document.getElementById("status").textContent =
      "Popup blocked! Please allow popups for this site.";

  } else {

    document.getElementById("status").textContent =
      "Camera opened! Take your photo.";

  }

}

// Listen for the photo sent by camera.html
window.addEventListener("message", function(event) {

  // Security: only accept messages from our own GitHub Pages site
  if (event.origin !== location.origin) return;

  // Only accept messages from the window we opened
  if (event.source !== cameraWindow) return;

  if (event.data && event.data.type === "photo-captured") {

    document.getElementById("photo").src =
      event.data.photo;

    document.getElementById("photo").style.display =
      "block";

    document.getElementById("result").style.display =
      "block";

    document.getElementById("status").textContent = "";

  }

});

</script>

</body>
</html>


</script>

</body>
</html>
